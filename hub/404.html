<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="%BASE_PATH%">
  <title>Page not found | Playbase</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('playbase-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body class="lost">
  <main class="lost-card">
    <h1>That page isn't here</h1>
    <p>The link may be old, or a game may have moved. Every game is on the home page.</p>
    <a class="btn primary" href="./">Back to the games</a>
  </main>
</body>
</html>
